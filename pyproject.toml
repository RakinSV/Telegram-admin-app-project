[tool.bandit]
# Задокументированный baseline принятых low-severity находок (security-ревью
# Guardian G09-G17), чтобы допущения жили в репозитории, а не только в
# описании таска/PR — иначе "низкая серьёзность" молча становится слепой
# зоной для будущих РЕАЛЬНЫХ находок той же категории.
#
# B101 (assert_used) — `assert x is not None` в проде для сужения типов
#   там, где библиотека типизирует поле как `X | None`, но инвариант кода
#   гарантирует, что оно всегда задано (см. tg_repost/telegram/moderation_bot.py,
#   tg_repost/webui/supervisor.py). Не проверка бизнес-инварианта.
# B105 (hardcoded_password_string) — ложное срабатывание: строка
#   "Telegram Bot Token" в tg_repost/webui/settings_store.py — это
#   UI-подпись поля для write-only формы секретов, не сам секрет.
# B311 (blacklist / random) — `random.randint`/`random.choice`/`random.uniform`
#   используются только для генерации капчи (guardian/services/captcha.py,
#   не криптографический токен) и джиттера антибан-задержек
#   (tg_repost/antiban.py) — не для секретов/токенов/ключей.
skips = ["B101", "B105", "B311"]

[tool.ruff]
# Конфигурации ruff НЕ БЫЛО ВООБЩЕ до 2026-08-19: работал набор по умолчанию
# (часть pycodestyle + pyflakes). Из-за этого `# noqa: BLE001` в коде ничего
# не значил — правила, которое он подавляет, просто не существовало в наборе.
line-length = 100

[tool.ruff.lint]
# Набор выбран по замеру, а не по вкусу: каждое включённое правило прогонялось
# по всему коду, и включены те, что ловят ОШИБКИ, а не оформление.
select = [
    "E4", "E7", "E9", "F",  # то, что работало и раньше
    "B",      # bugbear: изменяемые значения по умолчанию, zip без strict
    "BLE",    # слепой `except Exception` без причины
    "ASYNC",  # блокирующие вызовы внутри async
    "C4",     # лишние генераторы и comprehension-ы
    "PIE",    # мелкие бессмысленности вроде range(0, n)
    "RUF100", # `# noqa` на правило, которого нет: мёртвое указание врёт
]
# SIM намеренно НЕ включён: пятнадцать находок, и все — про оформление
# (`contextlib.suppress` вместо `try/except/pass`, слитые `if`). Ошибок он
# здесь не находит, а переписывать пятнадцать мест ради стиля — это диффы
# без выгоды.
#
# RUF001/002/003 (ambiguous-unicode) не включены по той же причине, только
# жёстче: 5604 находки, и все до одной — на кириллице в комментариях и
# docstring-ах. Правило рассчитано на англоязычный код.
ignore = [
    # FastAPI по устройству требует вызовы в значениях по умолчанию:
    # `file: UploadFile = File(...)`, `name: str = Form("")`. Это не ошибка,
    # а единственный способ объявить параметр формы.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# В тестах слепой `except` в диверсиях и вспомогательных обёртках допустим:
# там важно «упало или нет», а не какое именно исключение.
"tests/*" = ["BLE"]
