name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ночью — прогон в перемешанном порядке файлов (см. job `shuffled`).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # engage добавлен 2026-08-19: третий бот системы не проверялся в CI
      # НИ ОДНОЙ проверкой — ни ruff, ни mypy, ни bandit. Он делит базу с
      # tg_repost и трогает деньги (магазин, подписки), то есть цена
      # незамеченной ошибки там ровно та же.
      - name: ruff check
        run: ruff check tg_repost guardian engage tests

      - name: mypy
        run: mypy tg_repost guardian engage

      - name: pytest
        run: pytest

      - name: bandit (baseline в pyproject.toml)
        run: bandit -r tg_repost guardian engage -c pyproject.toml

      - name: pip-audit
        run: pip-audit -r requirements.txt

  # ЗАВИСИМОСТЬ ТЕСТА ОТ СОСЕДА — отдельный вид поломки, и обычный прогон её
  # не видит: порядок файлов у pytest фиксирован, поэтому связь всплывает
  # через месяцы, когда добавят один новый файл. Разбор 2026-08-19 нашёл
  # перемешиванием ШЕСТЬ таких источников подряд: журнал действий,
  # переполнявший лимит выборки; живые компоненты; счётчик неудачных входов;
  # цели с галочкой Guardian; строку в bot_config, меняющую саму механику
  # настроек; реестр обработчиков очереди.
  #
  # Ночью, а не на каждый push: прогон стоит ещё десять минут, а ошибки этого
  # рода появляются не чаще, чем раз в несколько недель.
  shuffled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest в перемешанном порядке файлов
        run: |
          # Без tr: неквотированная подстановка и так делится по пробелам
          # и переводам строк, а pytest берёт файлы списком аргументов.
          ORDER=$(ls tests/test_*.py | shuf)
          # Порядок печатается ОБЯЗАТЕЛЬНО: без него падение
          # невоспроизводимо, а значит бесполезно.
          echo "порядок файлов:"
          echo "$ORDER"
          pytest -q $ORDER
